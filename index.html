  // bridge 自身は「先頭即時 + 2 秒クールダウン + 末尾フラッシュ」に抑制する。
  // クールダウン中の合成則はチャネルごとに異なる: サーバーはスコアを「受信した値のベスト」で
  // 保持するため、score は最大値を残す（100 → 0 と続いても 100 を失わない）。save は最新値が正。
  var THROTTLE_MS = 2000;
  var TEARDOWN_WINDOW_MS = 2000;
  // teardown 窓内の即時フラッシュ回数上限（チャネル別）。score は本文が数百バイトなので余裕を
  // 持たせ、save は最大 4KB 強 × keepalive の合計 in-flight 64KiB 制限（Fetch 仕様）を圧迫しない
  // よう 3 回に絞る（3 × 4KB ≒ 12KB。codex-review 反復 6 P2。現実のゲームの teardown 書き込みは
  // 1〜2 回であり実質失わない）
  var TEARDOWN_SCORE_FLUSH_BUDGET = 10;
  var TEARDOWN_SAVE_FLUSH_BUDGET = 3;
  // 通常の compose 出力では bridge を生成コードより前へ注入するため、この時点の Date.now /
  // setTimeout を閉じ込め、後からの偶発的な monkey-patch の影響を減らす（反復 6 P1）。ただし
  // 不正な HTML 配置等で先行 script が存在し得る以上、未汚染を権威性の根拠にはしない。
  var nativeDateNow = Date.now;
  var nativeSetTimeout = global.setTimeout.bind(global);
  function makeThrottledSender(send, coalesce, teardownBudgetMax) {
    var cooldown = false;
    var pending = null;
    function trigger(value) {
      cooldown = true;
      send(value);
      nativeSetTimeout(function () {
        cooldown = false;
        if (pending !== null) {
          var next = pending;
          pending = null;
          trigger(next);
        }
      }, THROTTLE_MS);
    }
    // teardown 用の即時フラッシュ窓。trusted なライフサイクルイベントを bridge のリスナーが
    // 観測したときだけ「時間窓 + 回数上限」が付与され、窓内のクールダウン中 submit は即時
    // フラッシュされる。これにより「ゲーム側の pagehide ハンドラが bridge のフラッシュより後に
    // GCN.save/score を呼ぶ」順序でも、teardown 中に同一チャネルへ複数回書く正当なゲーム
    // （pagehide リスナー 2 つ等。codex-review 反復 5 P1）でも最終値を取りこぼさない。
    // document.visibilityState は Object.defineProperty で偽装できる（反復 4 P1）ため判定に
    // 使わない — 窓は trusted イベント由来のみで、合成イベント・プロパティ偽装では開かない。
    // 乱用の上限は「実イベント 1 回あたり teardownBudgetMax 回・TEARDOWN_WINDOW_MS 以内」。
    // 上限超過後の書き込みは pending に合成されるだけになる（現実のゲームの teardown 書き込みは
    // 1〜2 回であり実質失わない）
    var teardownWindowUntil = 0;
    var teardownFlushBudget = 0;
    function submit(value) {
      if (cooldown) {
        pending = pending === null ? value : coalesce(pending, value);
        if (teardownFlushBudget > 0 && nativeDateNow() < teardownWindowUntil) {
          teardownFlushBudget--;
          submit.flush();
        }
        return;
      }
      trigger(value);
    }
    // ページ破棄時の取りこぼし防止: クールダウン待ちの未送信値を即時送信する
    // （タイマーはフレーム破棄で消えるため、待っていると親に届かない）
    submit.flush = function () {
      if (pending !== null) {
        var next = pending;
        pending = null;
        send(next);
      }
    };
    submit.armTeardownFlush = function () {
      teardownWindowUntil = nativeDateNow() + TEARDOWN_WINDOW_MS;
      teardownFlushBudget = teardownBudgetMax;
    };
    submit.disarmTeardownFlush = function () {
      teardownWindowUntil = 0;
      teardownFlushBudget = 0;
    };
    return submit;
  }
  var sendScoreThrottled = makeThrottledSender(function (score) {
    sendPortMessage({ kind: "gamekit-score", versionId: diagVersionId, score: score });
  }, function (a, b) {
    return a > b ? a : b;
  }, TEARDOWN_SCORE_FLUSH_BUDGET);
  var sendSaveThrottled = makeThrottledSender(function (json) {
    sendPortMessage({ kind: "gamekit-save", versionId: diagVersionId, data: json });
  }, function (a, b) {
    return b;
  }, TEARDOWN_SAVE_FLUSH_BUDGET);
  function flushPendingMessages() {
    sendScoreThrottled.flush();
    sendSaveThrottled.flush();
  }
  function armTeardownFlush() {
    sendScoreThrottled.armTeardownFlush();
    sendSaveThrottled.armTeardownFlush();
  }
  function disarmTeardownFlush() {
    sendScoreThrottled.disarmTeardownFlush();
    sendSaveThrottled.disarmTeardownFlush();
  }
  // pagehide は iOS Safari でも発火する。visibilitychange は保険（gamekit.js rt-9 と同じ）。
  // isTrusted ガード: ゲームコードが dispatchEvent(new Event("pagehide")) で合成イベントを
  // 連打してもフラッシュ（= スロットリングのバイパス経路）を踏めないようにする。
  // フラッシュ後に arm するのは、同じイベントディスパッチ内で後から動くゲーム側ハンドラの
  // GCN.save/score を即時送信するため（時間窓 + 回数上限。makeThrottledSender 参照）。
  // hidden 判定は偽装可能な visibilityState を見ず「pagehide = 破棄へ向かう」
  // 「visibilitychange = 表示状態が切り替わった」という trusted イベントの発生自体で扱う。
  global.addEventListener("pagehide", function (event) {
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });
  global.addEventListener("pageshow", function (event) {
    // bfcache から復帰したら通常のスロットリング動作に戻す（未使用の窓を破棄）
    if (event.isTrusted) {
      disarmTeardownFlush();
    }
  });
  global.addEventListener("visibilitychange", function (event) {
    // hidden への遷移か visible への復帰かを visibilityState で区別しない（偽装可能なため）。
    // どちら向きでも「未送信分をフラッシュして窓を付与」で統一する — visible 復帰時に短時間の
    // 即時送信を許すだけで、乱用には trusted イベントの実発生が必要なので有害でない
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });

  var GCN = {
    saveData: null,
    // rtfree-3（D-067）: 公開タイトル。gamekit-init 受信までは null（プレビューでは常に null）
    publicTitle: null,
    assets: assetsManifest,
    onInit: undefined,
    score: function (n) {
      if (typeof n !== "number" || !isFinite(n)) {
        reportError("GCN.score: 数値を渡してください");
        return;
      }
      sendScoreThrottled(Math.floor(n));
    },
    save: function (json) {
      if (typeof json !== "string") {
        reportError("GCN.save: JSON 文字列を渡してください（JSON.stringify 済みのもの）");
        return;
      }
      sendSaveThrottled(json);
    }
  };

  global.GCN = GCN;
})(window);
</script>

<script>
(function(){

function advance(now){if(state!=='playing')return;if(now>=deadline){endGame();return;}if(now<phaseAt)return;if(phase==='wait'){goAt=now;var elapsed=now-startedAt;goWindow=elapsed>=40000?800:elapsed>=20000?1000:1200;phaseAt=now+goWindow;setPhase('go');pulse=.65;rings.push({x:W/2,y:H/2,r:30,life:.8});}else if(phase==='go'){streak=0;el.chain.textContent='連続成功 0 回';setPhase('miss');phaseAt=now+350;}else{setPhase('wait');phaseAt=now+900+Math.random()*900;}}
function hit(x,y){var now=performance.now();advance(now);if(state!=='playing')return;if(phase==='go'){var rt=Math.max(0,Math.round(now-goAt));streak++;hits++;totalReaction+=rt;fastest=Math.min(fastest,rt);var gain=Math.max(10,Math.round(100-rt*.12))+Math.min(10,streak-1);score+=gain;setPhase('success');phaseAt=now+350;el.cueDetail.textContent=rt+' ms  /  +'+gain+'点';el.last.textContent='直前の反応 '+rt+' ms';el.chain.textContent='連続成功 '+streak+' 回';burst(x,y,25);tone(740,.14);}else if(phase==='wait'){score=Math.max(0,score-5);streak=0;setPhase('early');phaseAt=now+350;el.last.textContent='色が変わるまで、ひと呼吸';el.chain.textContent='連続成功 0 回';burst(x,y,12);tone(190,.16);}else{burst(x,y,7);}el.score.textContent=score;}
function bindStart(button){function trigger(e){if(e.type!=='click')e.preventDefault();if(state==='playing')return;startGame();try{audioReady();tone(480,.12);}catch(err){}}button.addEventListener('click',trigger);button.addEventListener('pointerdown',trigger,{passive:false});button.addEventListener('touchstart',trigger,{passive:false});}
bindStart(el.start);bindStart(el.again);
el.mute.addEventListener('click',function(){muted=!muted;el.mute.textContent=muted?'音：オフ':'音：オン';el.mute.setAttribute('aria-pressed',String(muted));try{audioReady();if(!muted)tone(600,.1);}catch(e){}});
function begin(kind,id,x,y){if(kind==='pointer'){if(pointerId!==null)return;pointerId=id;}else{if(touchId!==null)return;touchId=id;}if(contact)return;contact=true;clickSuppress=performance.now()+600;hit(x,y);try{audioReady();}catch(e){}}
function move(kind,id,x,y){}
function finish(kind,id){if(kind==='pointer'&&pointerId===id)pointerId=null;if(kind==='touch'&&touchId===id)touchId=null;if(pointerId===null&&touchId===null)contact=false;}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(e.isPrimary===false)return;try{cv.setPointerCapture(e.pointerId);}catch(err){}begin('pointer',e.pointerId,e.clientX,e.clientY);},{passive:false});
cv.addEventListener('pointermove',function(e){move('pointer',e.pointerId,e.clientX,e.clientY);});
cv.addEventListener('pointerup',function(e){finish('pointer',e.pointerId);});cv.addEventListener('pointercancel',function(e){finish('pointer',e.pointerId);});
cv.addEventListener('touchstart',function(e){e.preventDefault();var q=e.changedTouches[0];if(q)begin('touch',q.identifier,q.clientX,q.clientY);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var q=e.changedTouches[i];move('touch',q.identifier,q.clientX,q.clientY);}},{passive:false});
function touchEnd(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)finish('touch',e.changedTouches[i].identifier);}
cv.addEventListener('touchend',touchEnd,{passive:false});cv.addEventListener('touchcancel',touchEnd,{passive:false});
cv.addEventListener('click',function(e){if(performance.now()<clickSuppress)return;hit(e.clientX,e.clientY);try{audioReady();}catch(err){}});
function update(){t+=1/60;pulse*=.9;flash*=.86;for(var j=0;j<3;j++)color[j]+=(target[j]-color[j])*.2;for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life-=.026;if(p.life<=0)particles.splice(i,1);}for(var k=rings.length-1;k>=0;k--){rings[k].r+=4;rings[k].life-=.025;if(rings[k].life<=0)rings.splice(k,1);}var now=performance.now();advance(now);if(state==='playing'){var left=Math.max(0,deadline-now);el.time.textContent=Math.ceil(left/1000);el.bar.style.transform='scaleX('+(left/60000)+')';}}
function draw(){ctx.setTransform(D,0,0,D,0,0);var c=color.map(function(v){return Math.round(v);}).join(',');var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#10142e');g.addColorStop(.5,'#0c1027');g.addColorStop(1,'#070b1d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);var glow=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.65);glow.addColorStop(0,'rgba('+c+','+(.13+flash*.13)+')');glow.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(var i=0;i<45;i++){var x=(Math.sin(i*45.17)*.5+.5)*W,y=((i*73.37+t*(2+i%3))% (H+40))-20;ctx.fillStyle='rgba(184,190,255,'+(.08+.12*(.5+.5*Math.sin(t+i)))+')';ctx.beginPath();ctx.arc(x,y,i%4===0?1.4:.65,0,Math.PI*2);ctx.fill();}var r=Math.min(W*.68,H*.39,340)/2;if(W>=560&&H<=540)r=Math.min(H*.48,240)/2;ctx.save();ctx.translate(W/2,H/2);ctx.strokeStyle='rgba('+c+',.13)';ctx.lineWidth=1;[1.10,1.23,1.37].forEach(function(s,k){ctx.beginPath();ctx.arc(0,0,r*s+Math.sin(t*1.6+k)*2,0,Math.PI*2);ctx.stroke();});ctx.rotate(t*.09);for(var a=0;a<48;a++){var angle=a/48*Math.PI*2;ctx.strokeStyle='rgba('+c+','+(a%4===0?.4:.12)+')';ctx.beginPath();ctx.moveTo(Math.cos(angle)*r*1.30,Math.sin(angle)*r*1.30);ctx.lineTo(Math.cos(angle)*r*(a%4===0?1.34:1.32),Math.sin(angle)*r*(a%4===0?1.34:1.32));ctx.stroke();}ctx.rotate(-t*.21);ctx.shadowColor='rgb('+c+')';ctx.shadowBlur=12;ctx.strokeStyle='rgba('+c+',.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*1.10,.25,1.15);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*1.23,3.3,3.8);ctx.stroke();ctx.restore();if(pulse>.01){ctx.strokeStyle='rgba('+c+','+pulse*.5+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,r*(1.04+(1-pulse)*.12),0,Math.PI*2);ctx.stroke();}ctx.globalCompositeOperation='lighter';for(var k=0;k<rings.length;k++){var q=rings[k];ctx.strokeStyle='rgba('+c+','+q.life*.65+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke();}for(var n=0;n<particles.length;n++){var p=particles[n];ctx.fillStyle='rgba('+c+','+p.life+')';ctx.shadowBlur=8;ctx.shadowColor='rgb('+c+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}
var STEP=1000/60,acc=0,prevNow=0;function frame(now){requestAnimationFrame(frame);if(!prevNow)prevNow=now;var dt=Math.min(now-prevNow,250);prevNow=now;acc+=dt;var steps=0;while(acc>=STEP&&steps<5){acc-=STEP;steps++;update();}if(steps>=5)acc=0;draw();}
el.stage.hidden=true;requestAnimationFrame(frame);
})();
